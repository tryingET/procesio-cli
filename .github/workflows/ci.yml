name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The credential store is per-OS, so it is tested per-OS. A change that only
    # works on the maintainer's machine is exactly what this matrix is for.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # Without this the matrix is decoration: uv picks its own interpreter,
          # every job runs the same one, and the job names claim a coverage the
          # run does not have.
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - name: tests
        # Every suite the repo ships, including the skill measurement and
        # validation suites. A green CI must exercise the agent-facing layer too.
        run: uv run pytest tools agents dashboard webplatform skills -q
      - name: original skill baseline is reproducible
        run: >-
          uv run python scripts/evaluate-skills.py
          --catalog skills/evals/baseline-catalog.json
          --verify-baseline skills/evals/baseline.json
      - name: corrected routing baseline is reproducible
        run: >-
          uv run python scripts/evaluate-skill-routing.py
          --catalog skills/evals/baseline-catalog.json
          --verify skills/evals/baseline-routing-v2.json
      - name: candidate skill routing clears Gate 3
        run: >-
          uv run python scripts/evaluate-skill-routing.py
          --min-accuracy 0.95
          --max-collision-rate 0
      - name: skills are structurally valid
        run: uv run python scripts/validate-skills.py --strict-warnings
      - name: no secrets in tracked files
        run: uv run python scripts/secret_scan.py
      - name: generated files are current
        run: uv run python scripts/build-router.py --check
